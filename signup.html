<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register Patron Account — Create your digital profile for tailored measurement records and fitting notifications.">
  <meta name="keywords" content="tailor account signup, bespoke client registration, custom suit fitting portal">
  <title>Create Patron Account | Atelier Bespoke</title>

  <!-- Google Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="d-flex flex-column min-vh-100 bg-main justify-content-center align-items-center py-4">

  <!-- Floating Utility Controls -->
  <div class="position-absolute top-0 end-0 p-3 d-flex gap-2">
    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Light Dark Theme">
      <i class="bi bi-moon-stars-fill"></i>
    </button>
    <button class="rtl-toggle-btn" id="rtlToggleBtn" aria-label="Toggle RTL Layout" title="Switch to RTL Layout">RTL</button>
  </div>

  <div class="container my-auto">
    <!-- Centered Brand Logo at Top -->
    <div class="text-center mb-4">
      <a class="navbar-brand-logo justify-content-center" href="index.html">
        <i class="bi bi-scissors color-accent"></i> Atelier Bespoke
      </a>
    </div>

    <!-- Centered Signup Box -->
    <div class="row justify-content-center">
      <div class="col-11 col-sm-9 col-md-8 col-lg-6 col-xl-5">
        <div class="glass-card p-4 p-md-5">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus color-accent fs-1"></i>
            <h2 class="fw-bold mt-2 h3">Create Account</h2>
            <p class="small text-secondary mb-0">Register your profile for custom measurement records.</p>
          </div>

          <!-- Social Signup Buttons (Google & Apple) -->
          <div class="d-flex gap-2 mb-3">
            <button type="button" onclick="alert('Google Sign-Up (UI Only)');" class="btn btn-tailor-outline w-50 d-inline-flex align-items-center justify-content-center gap-2 py-2">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span class="small">Google</span>
            </button>

            <button type="button" onclick="alert('Apple Sign-Up (UI Only)');" class="btn btn-tailor-outline w-50 d-inline-flex align-items-center justify-content-center gap-2 py-2">
              <i class="bi bi-apple fs-5"></i>
              <span class="small">Apple</span>
            </button>
          </div>

          <div class="d-flex align-items-center my-3">
            <div class="border-bottom w-100"></div>
            <span class="px-2 small text-secondary text-nowrap">or register with email</span>
            <div class="border-bottom w-100"></div>
          </div>

          <form onsubmit="event.preventDefault(); alert('Account registered successfully! (UI Only)'); window.location.href='login.html';">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold small">First Name *</label>
                <input type="text" class="form-control-tailor" placeholder="Alexander" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Last Name *</label>
                <input type="text" class="form-control-tailor" placeholder="Vance" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Email Address *</label>
                <input type="email" class="form-control-tailor" placeholder="alexander@domain.com" required>
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold small">Phone / WhatsApp *</label>
                <input type="tel" class="form-control-tailor" placeholder="+1 (555) 019-2834" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Password *</label>
                <input type="password" class="form-control-tailor" placeholder="••••••••" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold small">Confirm Password *</label>
                <input type="password" class="form-control-tailor" placeholder="••••••••" required>
              </div>
            </div>

            <div class="form-check my-3">
              <input class="form-check-input" type="checkbox" id="termsSignup" required>
              <label class="form-check-label small text-secondary" for="termsSignup">
                I agree to the <a href="#" class="color-accent">Terms of Service</a> and <a href="#" class="color-accent">Privacy Policy</a>.
              </label>
            </div>

            <button type="submit" class="btn btn-tailor-gold btn-lg w-100 mb-3">Complete Registration</button>
          </form>

          <div class="text-center mt-3 pt-3 border-top">
            <p class="small text-secondary mb-0">Already registered? <a href="login.html" class="fw-bold color-accent">Sign In Here</a></p>
          </div>
        </div>

        <div class="text-center mt-3">
          <a href="index.html" class="small text-secondary"><i class="bi bi-arrow-left me-1"></i>Return to Homepage</a>
        </div>
      </div>
    </div>
  </div>

  <!-- JS Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
